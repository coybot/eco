name: DroneOperator
options:
  bundleIdPrefix: us.astral
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"
  AWSiOSSDKV2:
    url: https://github.com/aws-amplify/aws-sdk-ios-spm
    from: "2.36.0"

targets:
  DroneOperator:
    type: application
    platform: iOS
    sources:
      - path: DroneOperator
        excludes:
          - "**/.DS_Store"
    resources:
      - path: DroneOperator/Resources
    settings:
      base:
        INFOPLIST_FILE: DroneOperator/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: us.astral.drone
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: DroneOperator/DroneOperator.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: WebRTC
      - package: AWSiOSSDKV2
        product: AWSIoT
      - package: AWSiOSSDKV2
        product: AWSCore
