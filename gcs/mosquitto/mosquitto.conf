# Local mosquitto broker for GCS mode. Generate the password file first:
#   ./gen_mosquitto_auth.sh
# then start mosquitto with this config:
#   mosquitto -c gcs/mosquitto/mosquitto.conf

listener 1883
protocol mqtt

# Plain TCP for drones and the GCS server process on the LAN. Flip to a TLS
# listener (see the commented block below) once you've generated a CA with
# gen_mosquitto_auth.sh --tls.
allow_anonymous false
password_file mosquitto/passwd

# Optional: WebSocket listener for a future browser-based operator console.
listener 9001
protocol websockets
allow_anonymous false
password_file mosquitto/passwd

persistence true
persistence_location mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# --- TLS (optional, mirrors drone/common/local_control_api.py's self-signed
# cert pattern) - uncomment and point at the CA/cert/key gen_mosquitto_auth.sh
# --tls produces, then set mqtt.tls: true / gcs.mqtt_tls: true in the
# server/drone configs to match.
# listener 8883
# protocol mqtt
# cafile mosquitto/certs/ca.pem
# certfile mosquitto/certs/server.pem
# keyfile mosquitto/certs/server.key
# allow_anonymous false
# password_file mosquitto/passwd
