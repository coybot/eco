name: e2e-fast

# The always-on regression gate: no AWS creds, no phone/sim/emulator, no drone. See
# eco/e2e/README.md. Checks out the repo under a directory literally named "eco" because
# eco/e2e/run_e2e.py (and the existing eco/drone/common/tests/test_l5_parity.py) import
# `eco.*` as a package — that only resolves with an "eco/" folder one level below cwd.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Daemon-drone types (quad/rover/fixed-wing) — pure Python, no Swift/Xcode needed.
  python-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eco
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml numpy pytest
      - run: python3 -m eco.e2e.run_e2e --type quadcopter --tier fast
      - run: python3 -m eco.e2e.run_e2e --type rover --tier fast
      - run: python3 -m eco.e2e.run_e2e --type fixedwing --tier fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: eco/e2e/scorecard.json

  # phrover's on-device nav check (RoverNavTests) lives in the public coybot-sdk repo and
  # shares a SwiftPM package with ARKit-dependent code that only builds against an iOS
  # destination — needs Xcode + an iOS Simulator, not just a bare Swift toolchain, and
  # needs the sdk repo checked out as a sibling of eco (see eco/e2e/harness/phrover.py).
  phrover-fast:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eco
      - uses: actions/checkout@v4
        with:
          repository: coybot/coybot-sdk
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # numpy + pytest are needed by the tier-fast behaviour gate that run_e2e
      # always runs, not just by the phrover check itself.
      - run: pip install pyyaml numpy pytest
      - run: python3 -m eco.e2e.run_e2e --type phrover --tier fast
