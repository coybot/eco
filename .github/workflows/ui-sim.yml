name: ui-sim

# Build-and-boot smoke check for the phone apps, on every PR that touches a client app.
# Deliberately does NOT run the gated onboarding/mission tests (testOnboard_*,
# testDrive_forwardCommand_*) — those need a live drone/Presidio-Sim fleet and real Cognito
# creds, which hosted runners don't have. That full check runs nightly in e2e-live.yml on
# a self-hosted macOS runner. This job only proves each app still builds and launches.
#
# PhroverOperator moved to the public presidio-sdk repo (sdk/examples/PhroverOperator) — its
# build-and-boot smoke check lives in that repo's own CI, not here.
on:
  pull_request:
    paths:
      - "client/ios/**"
      - "client/android/**"

jobs:
  ios-launch-smoke:
    runs-on: macos-latest
    strategy:
      matrix:
        app: [DroneOperator]
        include:
          - app: DroneOperator
            test: DroneOperatorUITests/DroneOperatorUITests/testLaunch_showsAuthOrFleet
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild version
        run: xcodebuild -version
      - name: Build + run launch smoke test
        working-directory: client/ios/${{ matrix.app }}
        run: |
          xcodebuild test -project ${{ matrix.app }}.xcodeproj -scheme ${{ matrix.app }} \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:${{ matrix.test }}

  android-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug
