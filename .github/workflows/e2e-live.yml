name: e2e-live

# Full-stack nightly regression: launches Presidio Sim (Godot) drones and drives them
# through the real AWS dev stack — both headlessly (run_e2e.py --tier live) and through
# the real phone apps (run_phone.sh), so this is the fullest signal available short of a
# human with a device. Needs a self-hosted macOS runner, pre-provisioned per
# eco/drone/sim/BRINGUP_MAC.md (Godot binary, .venv-mac, IoT certs already provisioned
# for the sim-*-e2e ids below via provision_sim_certs.sh) — this workflow does not
# provision the host itself, only drives it.
on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC nightly
  workflow_dispatch: {}

env:
  ISHMAEL_API_BASE: ${{ secrets.ISHMAEL_API_BASE }}
  ISHMAEL_API_TOKEN: ${{ secrets.ISHMAEL_API_TOKEN }}
  ISHMAEL_IOT_ENDPOINT: ${{ secrets.ISHMAEL_IOT_ENDPOINT }}
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

jobs:
  live:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: eco

      - name: Bring up Presidio Sim fleet (quad/rover/fixedwing)
        working-directory: eco
        run: |
          for t in quadcopter rover fixedwing; do
            DRONES="sim-$t-e2e:$t" ENV=plaza bash drone/sim/launch_fleet_mac.sh &
          done
          sleep 30  # let Godot boot before the headless run starts polling for Online

      - name: Headless live e2e (all 4 types)
        run: python3 -m eco.e2e.run_e2e --type all --tier live

      - name: Phone UI live e2e (best-effort, needs real Cognito creds)
        continue-on-error: true
        run: |
          for t in quadcopter rover fixedwing phrover; do
            eco/e2e/run_phone.sh --type "$t" --platform ios || true
          done

      - name: Stop Presidio Sim fleet
        if: always()
        run: bash eco/drone/sim/launch_fleet_mac.sh stop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-live-results
          path: |
            eco/e2e/scorecard.json
            ~/videos/ishmael-ios/
