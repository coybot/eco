# Three loopback copies of the D435i colour feed, pinned to video20-22. The
# RealSense cameras take video0-11 and the Jetson's own nodes sit below that, so
# no USB enumeration order can put a camera on a loopback's number (it did:
# video_nr=10,11 landed on a RealSense and photos failed with "could not open").
# card_label gives each node a name that udev turns into /dev/eco-*; consumers
# use the names, never the numbers.
#   eco-stream  the RTSP/video stream
#   eco-color   the drone's photos and perception (CAMERA_DEVICE)
#   eco-watch   the cam-split watchdog, alone on its node
options v4l2loopback devices=3 video_nr=20,21,22 exclusive_caps=1,1,1 card_label="eco-stream,eco-color,eco-watch"
