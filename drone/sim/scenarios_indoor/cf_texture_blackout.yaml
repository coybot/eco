# Survive on five ToF beams alone. The camera goes fully blind mid-run (sensor_dropout), which
# is the realistic monocular-depth failure: a blank painted wall gives the depth network nothing
# to key on. Plus an HVAC draft the vehicle cannot sense at all.
# NOTE: wind_shift's handler reads `vector:`, not `wind:` — the 18 outdoor scenarios all write
# `wind:` and have therefore always run the default [1,0,0]. Use the real key here.
name: cf_texture_blackout
environment: indoor
room: {size: [6.0, 4.0], height: 2.4, wall_thickness: 0.08, ceiling: true}
team:
  - {id: cf_0, type: crazyflie, pos: [-2.5, 0.0, 1.0], goal: [2.5, 0.0, 1.0]}
duration_s: 45
goal_tol_m: 0.25
thresholds: indoor
sensing: {mode: realistic, impairment: crazyflie_decks}
obstacles:
  - [-1.0,  0.7, 0.5, 0.25, 0.6, 0.5]
  - [ 0.3, -0.8, 0.5, 0.25, 0.5, 0.5]
  - [ 1.5,  0.7, 0.5, 0.25, 0.5, 0.5]
injects:
  - {at: 8,  do: sensor_dropout, agent: any}
  - {at: 2,  do: wind_shift, vector: [0.15, 0.10, 0.0]}
success:
  mission_complete: true
  no_collisions: true
