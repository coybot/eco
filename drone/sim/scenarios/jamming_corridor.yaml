# Family: comms/GPS degradation
# A localized jamming zone sits over the route; links through it are nulled, but
# agents outside keep talking. Tests partial-comms operation, not full blackout.
name: jamming_corridor
environment: warehouse
team: [quad x2, rover x1]
duration_s: 120
obstacles:
  - [0, 4.0, 1.5, 0.5, 4.0, 3.0]    # wall forcing the team through a gap
  - [0, -4.0, 1.5, 0.5, 4.0, 3.0]
mission:
  type: goto
injects:
  - {at: 10, do: jamming_zone, center: [0, 0, 0], radius: 6.0}
success:
  mission_complete: true
  no_collisions: true
