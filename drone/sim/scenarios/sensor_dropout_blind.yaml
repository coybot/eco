# Family: agent/sensor failure
# A rover's obstacle sensor fails (reports all-clear). The obstacles are placed
# off the rover's direct path (y=0) so the sighted baseline navigates around them
# and the blind rover passes straight through — testing graceful degradation.
# Quads fly at 5.5m above obstacle ceiling (4.5m) with clear air.
name: sensor_dropout_blind
environment: warehouse
team:
  - {id: quad_0, type: quad, pos: [-12, -2, 5.5], goal: [12, -2, 5.5]}
  - {id: quad_1, type: quad, pos: [-12,  2, 5.5], goal: [12,  2, 5.5]}
  - {id: rover_0, type: rover, pos: [-12, 0, 0], goal: [12, 0, 0]}
duration_s: 120
obstacles:
  # Obstacles off the rover's direct path — even with blind lateral drift the rover
  # stays clear; sighted baseline actively steers around them.
  - [4,  3.0, 0.75, 0.6, 0.6, 0.75]
  - [7,  3.0, 0.75, 0.6, 0.6, 0.75]
  - [4, -3.0, 0.75, 0.6, 0.6, 0.75]
  - [7, -3.0, 0.75, 0.6, 0.6, 0.75]
mission:
  type: goto
injects:
  - {at: 8, do: sensor_dropout, agent: rover_0}
success:
  mission_complete: true
  no_collisions: true
