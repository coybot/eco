# Family: agent/sensor failure
# A battery emergency forces one agent to return-to-launch; the rest must still
# complete the search without it.
name: battery_rtl
environment: city
team: [quad x2, rover x2]
duration_s: 140
mission:
  type: area_search
  region: [-12, -12, 12, 12]
  targets: [[10, 6], [-9, 7], [8, -8]]
injects:
  - {at: 3, do: battery_emergency, agent: quad_0, home: [-12, 0, 0]}
success:
  targets_found: all
  no_collisions: true
