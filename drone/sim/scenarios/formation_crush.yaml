name: formation_crush
environment: warehouse
team:
  - {id: quad_0,  type: quad,  pos: [-10,  2, 5], goal: [10,  2, 5]}
  - {id: quad_1,  type: quad,  pos: [-10, -2, 5], goal: [10, -2, 5]}
  - {id: rover_0, type: rover, pos: [-10,  2, 0], goal: [10, -2, 0]}
  - {id: rover_1, type: rover, pos: [-10, -2, 0], goal: [10,  2, 0]}
duration_s: 45
obstacles:
  - [0,  6, 1.5, 0.5, 3.5, 3.0]
  - [0, -6, 1.5, 0.5, 3.5, 3.0]
injects:
  # Cross-goal rovers + contested quads + wind + deconfliction chokepoint
  - {at: 2,  do: contested_task, agents: [quad_0, quad_1], goal: [5, 0, 3]}
  - {at: 2,  do: tight_deconfliction, point: [0, 0, 0], overfly_z: 5.5}
  - {at: 2,  do: wind_shift, wind: [0.6, -0.4, 0.0]}
  - {at: 15, do: comms_blackout}
success:
  mission_complete: true
  no_collisions: true
