# Family: dynamic world events
# A fast intruder crosses the team's path mid-transit; agents must avoid it.
name: intruder_avoidance
environment: warehouse
team: [quad x2, rover x2]
duration_s: 120
mission:
  type: goto
injects:
  - {at: 6, do: spawn_dynamic, vclass: quad, speed: 4.0, path: [[12, 12, 2], [-12, -12, 2]]}
  - {at: 6, do: spawn_dynamic, vclass: quad, speed: 4.0, path: [[12, -12, 2], [-12, 12, 2]]}
success:
  mission_complete: true
  no_collisions: true
