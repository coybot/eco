name: sensor_hell
environment: warehouse
team:
  - {id: quad_0,  type: quad,  pos: [-10,  3, 5], goal: [10,  3, 5]}
  - {id: quad_1,  type: quad,  pos: [-10, -3, 5], goal: [10, -3, 5]}
  - {id: rover_0, type: rover, pos: [-10,  2, 0], goal: [10,  2, 0]}
  - {id: rover_1, type: rover, pos: [-10, -2, 0], goal: [10, -2, 0]}
duration_s: 60
obstacles:
  - [0,  6, 1.5, 0.5, 3.0, 3.0]
  - [0, -6, 1.5, 0.5, 3.0, 3.0]
  - [5,  0, 1.5, 0.8, 2.0, 3.0]
injects:
  # Phase 1: all blind (t=0→30s)
  - {at: 0,  do: sensor_dropout, agent: all}
  - {at: 0,  do: wind_shift,     wind: [0.4, 0.3, 0.0]}
  # Phase 2: GPS spoof kicks in after sensors come back (t=30→60s)
  - {at: 30, do: gps_spoof, agent: quad_0,  vel: [0.25,  0.1, 0.0]}
  - {at: 30, do: gps_spoof, agent: rover_1, vel: [0.2, -0.15, 0.0]}
  - {at: 35, do: comms_blackout}
success:
  mission_complete: true
  no_collisions: true
