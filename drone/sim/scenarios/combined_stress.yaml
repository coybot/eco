# Combined "everything at once" — the L5 gauntlet.
# Comms blackout + GPS spoof + teammate loss + intruder + wind, all during an
# area search. This is the scenario the autonomy scorecard reports as the headline.
name: combined_stress
environment: city
team: [quad x2, rover x2]
duration_s: 160
mission:
  type: area_search
  region: [-12, -12, 12, 12]
  targets: [[10, 8], [-9, 7], [8, -9], [-10, -7]]
injects:
  - {at: 2, do: spawn_dynamic, vclass: quad, speed: 4.0, path: [[12, 12, 2], [-12, -12, 2]]}
  - {at: 3, do: comms_blackout}
  - {on: target_found, do: gps_spoof, agent: any, vel: [0.4, 0.0, 0.0]}
  - {at: 5, do: agent_failure, agent: quad_1}
  - {when: any_low_confidence, do: wind_shift, vector: [0.5, 0.3, 0.0]}
success:
  targets_found: all
  no_collisions: true
