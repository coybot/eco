# Fixed-wing straight-line flight where a no-fly zone appears directly on the
# planned route shortly after launch, forcing a reroute mid-flight instead of an
# abort — the "Wall Went Up" capability scenario (see the fixed-wing AI plan).
# The zone's half-extent (30 m) sits inside the fixed-wing avoidance radius
# (turn_radius * 1.5 ~= 62.5 m at cruise, see team_world.reactive_goto_controller),
# so there is room to divert around it without clipping the boundary.
name: fw_replan
environment: none
team:
  - {id: fw_0, type: fixedwing, pos: [-250, 0, 60], goal: [250, 0, 60]}
duration_s: 60
obstacles: []
injects:
  - {at: 3, do: add_nofly, center: [0, 0, 60], half: [30, 30, 60]}
success:
  mission_complete: true
  no_collisions: true
