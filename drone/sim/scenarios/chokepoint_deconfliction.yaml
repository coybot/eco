# Family: coordination stress
# The whole team is funneled through one chokepoint at once; they must deconflict
# (take turns / separate in altitude) rather than collide.
name: chokepoint_deconfliction
environment: warehouse
team: [quad x3, rover x2]
duration_s: 120
obstacles:
  - [0, 3.0, 1.5, 0.6, 3.0, 3.0]    # gap centered at y=0, ~1m wide
  - [0, -3.0, 1.5, 0.6, 3.0, 3.0]
injects:
  - {at: 4, do: tight_deconfliction, at_point: [10, 0, 2]}
success:
  mission_complete: true
  no_collisions: true
