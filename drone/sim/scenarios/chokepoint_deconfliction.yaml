# Family: coordination stress
# Two rovers traverse a 6m chokepoint gap (walls at x=0) side by side, 3m apart.
# They start already at their goal Y values so the test is purely about threading
# the gap simultaneously without collision or stall.
name: chokepoint_deconfliction
environment: warehouse
team:
  - {id: rover_0, type: rover, pos: [-12, -1.5, 0], goal: [12, -1.5, 0]}
  - {id: rover_1, type: rover, pos: [-12,  1.5, 0], goal: [12,  1.5, 0]}
duration_s: 60
obstacles:
  # Walls with a 6m gap at y=0 — rovers can pass at |y| < 3
  - [0,  7.0, 1.5, 0.6, 4.0, 3.0]   # right wall y=3..11
  - [0, -7.0, 1.5, 0.6, 4.0, 3.0]   # left  wall y=-11..-3
injects: []
success:
  mission_complete: true
  no_collisions: true
