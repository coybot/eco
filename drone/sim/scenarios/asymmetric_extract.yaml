  - [2, -7, 1.5, 0.5, 3.0, 3.0]
  - [-4, 0, 1.5, 1.0, 2.0, 3.0]
  - [7,  3, 1.5, 0.5, 2.0, 3.0]
injects:
  - {at: 2,  do: gps_loss,   agent: rover_0}
  - {at: 2,  do: gps_loss,   agent: rover_2}
  - {at: 5,  do: wind_shift, wind: [0.3, 0.4, 0.0]}
  - {at: 10, do: spawn_dynamic, path: [[14, 0, 4],[-14, 0, 4]], speed: 4.0}
