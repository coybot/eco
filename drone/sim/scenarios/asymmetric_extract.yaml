name: asymmetric_extract
environment: city
team:
  - {id: quad_0,  type: quad,  pos: [-8,  0, 5], goal: [10,  5, 5]}
  - {id: rover_0, type: rover, pos: [-8,  4, 0], goal: [10,  4, 0]}
  - {id: rover_1, type: rover, pos: [-8,  0, 0], goal: [10,  0, 0]}
  - {id: rover_2, type: rover, pos: [-8, -4, 0], goal: [10, -4, 0]}
