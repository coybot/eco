# Fixed-wing straight-line flight past widely-spaced towers, at fixed-wing scale
# (fixed-wing turn radius at cruise ~= max_speed_mps / max_yaw_rate_radps = 25/0.6
# ~= 42 m — obstacle spacing and offsets below are sized so a lateral divert is
# achievable within that radius, unlike the quad/rover dense_urban.yaml template
# this is modeled on). Proves policy_fw.onnx scores end-to-end via scorecard.py
# (--fw-policy) and that compare_runs' fixed-wing dispatch works.
name: fw_sweep
environment: none
team:
  - {id: fw_0, type: fixedwing, pos: [-250, 0, 60], goal: [250, 0, 60]}
duration_s: 45
obstacles:
  # Towers off the direct centerline (goal y=0) — half-extents (hx,hy,hz) in meters.
  - [-100,  40, 60, 15, 15, 60]
  - [   0, -40, 60, 15, 15, 60]
  - [ 100,  40, 60, 15, 15, 60]
injects:
  - {at: 10, do: wind_shift, vector: [1.0, -0.5, 0.0]}
success:
  mission_complete: true
  no_collisions: true
