# Every vehicle, sensor and environment number used by the docking work, in one place.
# All values are ESTIMATES unless a comment says otherwise. SI units; the unit is in the
# name. Angles in degrees here; the code converts.

environment:
  air_density_kg_m3: 1.225          # ISA sea level
  physics_dt_s: 0.0025              # 400 Hz fixed step for every body
  guidance_dt_s: 0.01               # 100 Hz navigation filters and outer loops

small_quadcopter:
  # NEW vehicle (Phase 2). Not the existing kinematic "quadcopter" class, which is unchanged.
  # Target from the task: ~1.0 kg empty, 1.4 kg with a drink, ~0.30 m across including prop
  # guards, thrust-to-weight 2.5, drag area ~0.05 m^2. Everything else is an ESTIMATE.
  mass_empty_kg: 1.0                # includes the docking probe and latch fitting
  mass_loaded_kg: 1.4               # with one drink (0.4 kg)
  thrust_to_weight_nd: 2.5
  thrust_to_weight_reference_mass_kg: 1.4   # T/W quoted at all-up weight -> 34.3 N total,
                                            # 8.6 N per motor. Sensitivity: 1.0 kg reference.
  across_m: 0.30                    # outer edge of guards, tip to tip
  prop_diameter_m: 0.102            # 4 in: the largest that fits 0.30 m with guards (5 in overlaps)
  arm_length_m: 0.089               # motor to centre: 0.15 - 0.051 prop radius - 0.010 guard
  body_radius_m: 0.15               # used for strike and collision checks
  inertia_kg_m2: [0.0045, 0.0045, 0.0070]   # at mass_empty_kg; probe adds to x/y; scaled with mass
  motor_tau_up_s: 0.025             # small high-kv motors on 4 in props
  motor_tau_down_s: 0.040
  yaw_torque_per_thrust_m: 0.012
  drag_area_m2: 0.05                # isotropic CdA (task figure); per-axis is a sensitivity case
  max_tilt_deg: 65.0
  controller:
    att_p_per_s: [8.0, 8.0, 3.0]
    rate_max_deg_s: [360.0, 360.0, 150.0]
    rate_p_per_s: [24.0, 24.0, 8.0]
    rate_i_per_s2: [30.0, 30.0, 8.0]
    rate_d_s: [0.012, 0.012, 0.0]
    rate_d_lpf_hz: 40.0
    thrust_usable_fraction_nd: 0.95
  nav:
    accel_noise_std_m_s2: 1.0
    history_s: 0.8
    gnss_pos_var_m2: 0.0004
    gnss_vel_var_m2_s2: 0.0025
  landing_gear_feet_m: [[0.06, 0.06, -0.05], [0.06, -0.06, -0.05], [-0.06, 0.06, -0.05], [-0.06, -0.06, -0.05]]
  sensors:
    accel: {rate_hz: 400, delay_s: 0.003, noise_std: 0.05, bias_std: 0.05, bias_rw_std_per_sqrt_s: 0.002}
    gyro: {rate_hz: 400, delay_s: 0.003, noise_std: 0.005, bias_std: 0.003, bias_rw_std_per_sqrt_s: 0.0002}
    ahrs: {rate_hz: 200, delay_s: 0.010, noise_std_deg: 0.3, bias_std_deg: 0.5, bias_rw_deg_per_sqrt_s: 0.02}
    gnss: {rate_hz: 10, delay_s: 0.10, pos_noise_std_m: 0.015, pos_noise_std_vertical_m: 0.025,
           vel_noise_std_m_s: 0.03, dropout_p: 0.01, burst_rate_hz: 0.005, burst_len_s: 1.0}
    baro: {rate_hz: 50, delay_s: 0.02, noise_std: 0.10, bias_std: 0.5, bias_rw_std_per_sqrt_s: 0.01}

# Reference fixed-wing for the Phase 1 checks and for DynamicWorld's "fixedwing" class:
# the Aerosonde coefficients published in Beard & McLain, "Small Unmanned Aircraft"
# (2012), appendix E. Mass taken as 13.5 kg (their later errata value).
fixedwing_reference:
  mass_airframe_kg: 13.5
  inertia_kg_m2: [0.8244, 1.135, 1.759]
  cruise_airspeed_m_s: 25.0
  min_airspeed_cmd_m_s: 20.0       # elevator-limited near alpha 9 deg with these coefficients
  aero:
    wing_area_m2: 0.55
    span_m: 2.8956
    chord_m: 0.18994
    cl0_nd: 0.23
    cl_alpha_per_rad: 5.61
    cl_q_nd: 7.95
    cl_de_per_rad: 0.13
    cd0_nd: 0.043
    oswald_nd: 0.9
    alpha_stall_deg: 27.0
    stall_sharpness_per_rad: 50.0
    cm0_nd: 0.0135
    cm_alpha_per_rad: -2.74
    cm_q_nd: -38.21
    cm_de_per_rad: -0.99
    cy_beta_per_rad: -0.98
    cy_dr_per_rad: 0.19
    croll_beta_per_rad: -0.13
    croll_p_nd: -0.51
    croll_r_nd: 0.25
    croll_da_per_rad: 0.17
    croll_dr_per_rad: 0.0024
    cyaw_beta_per_rad: 0.073
    cyaw_p_nd: -0.069
    cyaw_r_nd: -0.095
    cyaw_da_per_rad: -0.011
    cyaw_dr_per_rad: -0.069
  pusher: {thrust_static_max_n: 60.0, v_zero_thrust_m_s: 45.0, tau_s: 0.15}
  servos: {limit_deg: 25.0, tau_s: 0.04, rate_deg_s: 300.0}
  autopilot:
    throttle_trim_nd: 0.4
    pitch_trim_deg: 0.0
    max_pitch_deg: 15.0
    max_bank_deg: 30.0
    alt_p_rad_per_m: 0.03
    alt_i_rad_per_m_s: 0.004
    alt_i_limit_m_s: 30.0
    alt_d_rad_per_m_s: 0.03
    pitch_p_nd: 1.5
    pitch_i_per_s: 1.0
    pitch_d_s: 0.15
    speed_p_per_m_s: 0.08
    speed_i_per_m: 0.04
    course_p_rad_per_rad: 1.2
    roll_p_nd: 0.8
    roll_i_per_s: 0.3
    roll_d_s: 0.05
    yaw_ay_rad_per_m_s2: 0.05
  nav: {accel_noise_std_m_s2: 1.0, history_s: 0.8, gnss_pos_var_m2: 0.0004, gnss_vel_var_m2_s2: 0.0025}
  sensors:
    accel: {rate_hz: 400, delay_s: 0.003, noise_std: 0.05, bias_std: 0.05, bias_rw_std_per_sqrt_s: 0.002}
    gyro: {rate_hz: 400, delay_s: 0.003, noise_std: 0.005, bias_std: 0.003, bias_rw_std_per_sqrt_s: 0.0002}
    ahrs: {rate_hz: 200, delay_s: 0.010, noise_std_deg: 0.3, bias_std_deg: 0.5, bias_rw_deg_per_sqrt_s: 0.02}
    gnss: {rate_hz: 10, delay_s: 0.10, pos_noise_std_m: 0.015, pos_noise_std_vertical_m: 0.025,
           vel_noise_std_m_s: 0.03, dropout_p: 0.01}
    baro: {rate_hz: 50, delay_s: 0.02, noise_std: 0.10, bias_std: 0.5}
    airspeed: {rate_hz: 50, delay_s: 0.02, noise_std: 0.3, bias_std: 0.2}

# Rigid-body numbers for the EXISTING kinematic "quadcopter" class, used only when a
# TeamWorld opts into flight.dynamic_world.DynamicWorld. The kinematic class itself
# (vehicle_class.QUADCOPTER: radius 0.15 m, 3.0 m/s, payload 0.5 kg, no mass) is unchanged.
# ESTIMATES: mass, inertia, thrust and drag are not given anywhere in the repo.
quadcopter_existing_dynamics:
  mass_empty_kg: 1.2
  mass_loaded_kg: 1.7
  thrust_to_weight_nd: 2.0
  thrust_to_weight_reference_mass_kg: 1.7
  arm_length_m: 0.11
  body_radius_m: 0.15
  inertia_kg_m2: [0.008, 0.008, 0.014]
  motor_tau_up_s: 0.035
  motor_tau_down_s: 0.055
  yaw_torque_per_thrust_m: 0.016
  drag_area_m2: 0.04
  max_tilt_deg: 35.0
  controller:
    att_p_per_s: [7.0, 7.0, 3.0]
    rate_max_deg_s: [220.0, 220.0, 120.0]
    rate_p_per_s: [20.0, 20.0, 8.0]
    rate_i_per_s2: [30.0, 30.0, 8.0]
    rate_d_s: [0.015, 0.015, 0.0]
  nav: {accel_noise_std_m_s2: 1.0, history_s: 0.8, gnss_pos_var_m2: 0.0004, gnss_vel_var_m2_s2: 0.0025}
  sensors:
    accel: {rate_hz: 400, delay_s: 0.003, noise_std: 0.05, bias_std: 0.05, bias_rw_std_per_sqrt_s: 0.002}
    gyro: {rate_hz: 400, delay_s: 0.003, noise_std: 0.005, bias_std: 0.003, bias_rw_std_per_sqrt_s: 0.0002}
    ahrs: {rate_hz: 200, delay_s: 0.010, noise_std_deg: 0.3, bias_std_deg: 0.5, bias_rw_deg_per_sqrt_s: 0.02}
    gnss: {rate_hz: 10, delay_s: 0.10, pos_noise_std_m: 0.015, pos_noise_std_vertical_m: 0.025,
           vel_noise_std_m_s: 0.03, dropout_p: 0.01}
    baro: {rate_hz: 50, delay_s: 0.02, noise_std: 0.10, bias_std: 0.5}

# ---------------------------------------------------------------------------------------
# Quadplane mothership modelled on the Makeflyeasy Pioneer 3200 mm VTOL.
# [P] = published (task brief / manufacturer listings; sources in PHASE_2.md "Sources"),
# [D] = derived from published numbers, [E] = estimate (not published).
quadplane:
  mtow_kg: 24.9                     # [P]
  max_payload_kg: 5.0               # [P]
  mass_airframe_kg: 19.6            # [D] airframe + 4x 6S 30 Ah batteries: endurance tests list
                                    #     20.6 kg take-off at 1 kg payload, 24.6 kg at 5 kg
  inertia_kg_m2: [3.0, 2.4, 5.1]    # [E] wing, 4 lift motors on a 1 m square, fuselage, batteries
  cruise_airspeed_m_s: 21.5         # [P] ArduPilot TRIM_ARSPD 21.5 m/s (MFE param file); set per run
  max_airspeed_m_s: 35.0            # [P]
  published_stall_speed_m_s: 14.0   # [P] mass not stated
  min_safe_cruise_airspeed_m_s: 20.0   # replaced by the Phase 2 result (see performance.py)
  design_turbulence_sigma_w_m_s: 0.77  # light turbulence at 50 m (MIL-HDBK-1797, W20 = 15 kt)
  design_gust_k_sigma_nd: 2.0          # a 2-sigma vertical gust must not reach CLmax
  turn_speed_factor_nd: 1.15           # turns flown 15 % faster than the straights: at 25 deg bank
                                       # the load factor raises stall speed 5 %; this keeps 1.3 Vs
  turn_bank_deg: 25.0                  # sets the racetrack turn radius
  aero:
    wing_area_m2: 1.0               # [P]
    span_m: 3.2                     # [P]
    chord_m: 0.3125                 # [D] area / span
    cl0_nd: 0.36                    # [E] cambered section (zero-lift alpha about -4 deg)
    cl_alpha_per_rad: 5.18          # [D] Helmbold, aspect ratio 10.24
    cl_q_nd: 6.0                    # [E]
    cl_de_per_rad: 0.30             # [E]
    cd0_nd: 0.045                   # [D] from the 5 kg endurance point (22.5 m/s, 24.6 kg, 176 min,
                                    #     2.66 kWh): CD0 0.037-0.048 for 55-65 % total efficiency
    oswald_nd: 0.80                 # [E]
    alpha_stall_deg: 19.0           # blend parameter: CLmax = 1.63 [D] at alpha 15.5 deg; 1.63 is the
                                    #     published 14 m/s stall read at 20 kg (the lightest published
                                    #     mass). Conservative case: CLmax 1.30 = alpha_stall_deg 15.0.
    stall_sharpness_per_rad: 40.0
    cd_flat_plate_nd: 1.98
    cm0_nd: 0.03                    # [E] near-zero elevator at cruise
    cm_alpha_per_rad: -0.52         # [E] 10 % static margin
    cm_q_nd: -12.0                  # [E] tailplane on the fuselage
    cm_de_per_rad: -0.90            # [E]
    cy_beta_per_rad: -0.40
    cy_dr_per_rad: 0.15
    croll_beta_per_rad: -0.06
    croll_p_nd: -0.55
    croll_r_nd: 0.15
    croll_da_per_rad: 0.18
    croll_dr_per_rad: 0.003
    cyaw_beta_per_rad: 0.06
    cyaw_p_nd: -0.05
    cyaw_r_nd: -0.07
    cyaw_da_per_rad: -0.01
    cyaw_dr_per_rad: -0.05
  pusher:                           # [P] MFE 6525 kv180, 12S 160 A ESC, APC 21x13 prop
    thrust_static_max_n: 120.0      # [E] APC 21x13 at ~6400 rpm (kv180 x 44 V x 0.8)
    v_zero_thrust_m_s: 55.0         # [D] linear fall-off sized so drag = thrust at the published 35 m/s
    tau_s: 0.15
  servos: {limit_deg: 22.0, tau_s: 0.04, rate_deg_s: 250.0}   # [P] stabilizer 28 up / 22 down
  autopilot:
    throttle_trim_nd: 0.40
    pitch_trim_deg: 2.0
    max_pitch_deg: 15.0
    max_bank_deg: 30.0
    alt_p_rad_per_m: 0.03
    alt_i_rad_per_m_s: 0.004
    alt_i_limit_m_s: 30.0
    alt_d_rad_per_m_s: 0.04
    pitch_p_nd: 1.2
    pitch_i_per_s: 0.8
    pitch_d_s: 0.12
    speed_p_per_m_s: 0.10
    speed_i_per_m: 0.04
    course_p_rad_per_rad: 1.0
    roll_p_nd: 0.6
    roll_i_per_s: 0.3
    roll_d_s: 0.05
    yaw_ay_rad_per_m_s2: 0.04
    alpha_protect_deg: 10.5          # stall protection: pitch <= flight path + 10.5 deg (CLmax at 15.5)
    underspeed_margin_m_s: 2.0       # full throttle when 2 m/s below the commanded airspeed
  nav: {accel_noise_std_m_s2: 1.0, history_s: 0.8, gnss_pos_var_m2: 0.0004, gnss_vel_var_m2_s2: 0.0025}
  sensors:
    accel: {rate_hz: 400, delay_s: 0.003, noise_std: 0.05, bias_std: 0.05, bias_rw_std_per_sqrt_s: 0.002}
    gyro: {rate_hz: 400, delay_s: 0.003, noise_std: 0.005, bias_std: 0.003, bias_rw_std_per_sqrt_s: 0.0002}
    ahrs: {rate_hz: 200, delay_s: 0.010, noise_std_deg: 0.3, bias_std_deg: 0.5, bias_rw_deg_per_sqrt_s: 0.02}
    gnss: {rate_hz: 10, delay_s: 0.10, pos_noise_std_m: 0.015, pos_noise_std_vertical_m: 0.025,
           vel_noise_std_m_s: 0.03, dropout_p: 0.01}
    baro: {rate_hz: 50, delay_s: 0.02, noise_std: 0.10, bias_std: 0.5}
    airspeed: {rate_hz: 50, delay_s: 0.02, noise_std: 0.3, bias_std: 0.2}
  link: {rate_hz: 50, latency_s: 0.04, jitter_s: 0.01, loss_p: 0.05, burst_rate_hz: 0.02, burst_len_s: 0.3}
  rail:                              # external rail under the fuselage (quads do not fit the bay)
    mass_base_kg: 0.30               # [E] carbon rail, mounts, wiring
    mass_per_dock_kg: 0.25           # [E] funnel, latch servo, fittings
    mass_kg: 0.80                    # 2 docks
    drag_area_m2: 0.012              # [E] rail + 2 empty funnels
    dock_offsets_m: [[0.10, 0.0, -0.50], [-0.32, 0.0, -0.50]]   # quad CG when docked (Phase 2 baseline)
    mount_pitch_deg: 45.0            # Phase 2 baseline; Phase 3 decides
  geometry:                          # body FLU, origin at the airframe CG
    fuselage: {length_m: 1.68, width_m: 0.25, height_m: 0.41, center_x_m: -0.14, center_z_m: 0.0}  # [P] L, H; [E] width, CG
    wing: {span_m: 3.2, chord_m: 0.3125, thickness_m: 0.04, center_x_m: -0.03, center_z_m: 0.20}
    lift_arms: {y_m: 0.50, front_x_m: 0.54, rear_x_m: -0.54, z_m: 0.18, radius_m: 0.015}  # [P] 1 m square, 1.082 m arm
    lift_rotors: {front_x_m: 0.50, rear_x_m: -0.50, z_m: 0.24, diameter_m: 0.559}       # [P] 22 in, 1 m square
    pusher: {x_m: -1.02, z_m: 0.0, diameter_m: 0.533}                                   # [P] APC 21 in at the tail; [E] x
    tailplane: {x_m: -0.86, z_m: 0.12, span_m: 0.90, chord_m: 0.20, thickness_m: 0.03}  # [E] size
    ventral_fin: {x_m: -0.86, top_z_m: -0.20, bottom_z_m: -0.50, chord_m: 0.24, thickness_m: 0.03}  # [P] fin below fuselage; [E] size
    rail: {center_x_m: -0.10, z_m: -0.235, length_m: 0.80, width_m: 0.08, height_m: 0.05}

mission:                             # small-quad delivery guidance (Phase 2)
  spinup_ramp_s: 1.2                 # rotor thrust ramp on the rail before the latch opens
  separate_drop_m: 3.0
  separate_sink_m_s: 2.0
  transit_speed_m_s: 12.0
  decel_m_s2: 3.0
  approach_height_m: 1.5
  standoff_m: 2.0
  hover_height_m: 0.6
  descend_speed_m_s: 0.4
  deliver_s: 5.0
  takeoff_climb_m: 1.5

vision:                              # quad camera seeing a fiducial at the throat [E]
  rate_hz: 30
  delay_s: 0.04
  jitter_s: 0.01
  dropout_p: 0.03
  burst_rate_hz: 0.05                # glare / blur bursts
  burst_len_s: 0.5
  fov_half_deg: 40.0
  range_min_m: 0.15
  range_max_m: 6.0
  noise_floor_m: 0.005
  noise_per_m2: 0.002

relnav:
  rel_accel_noise_std_m_s2: 1.5
  history_s: 0.8
  gate_sigma: 6.0
  link_pos_std_m: 0.03               # two RTK receivers on one correction stream
  link_vel_std_m_s: 0.05
  attitude_err_std_deg: 0.6

docking_guidance:
  station_m: 1.5                     # station: tip this far out of the mouth on the axis
  station_tol_m: 0.15                # on the ~0.2 s low-passed error
  station_dwell_s: 0.6
  close_speed_m_s: 0.5
  commit_m: 0.15
  mouth_margin_m: 0.02               # abort if the tip will pass outside mouth radius minus this
  past_throat_m: 0.10                # abort if the estimate puts the tip this far past the throat
  push_start_m: 0.06                 # within this of the throat, push in with push_force_n
  push_force_n: 6.0                  # 2x the latch detent (3 N)
  corridor_slope_nd: 0.25
  max_nav_age_s: 0.25
  approach_timeout_s: 8.0
  final_timeout_s: 2.5
  abort_speed_m_s: 1.0
  max_attempts: 3
  kp_per_s2: 9.0
  kd_per_s: 6.0
  ki_per_s3: 2.0
  dob_enabled: false                 # acceleration disturbance observer: tried, made it worse (DESIGN_LOG)
  dob_bandwidth_hz: 1.5
  accel_max_m_s2: 6.0
  contact_jump_m_s2: 6.0
  motor_stop_delay_s: 0.3
  trim_tilt_estimate_deg: 48.0

# ---------------------------------------------------------------------------------------
# Delivery HEXACOPTER (addendum, replaces small_quadcopter for the scenario). [A] = given in
# the addendum (still an estimate), [E] = my estimate, [D] = derived. Sizing check:
# docking/hex_sizing.py; changes from [A] values are listed in PHASE_2.md.
hexacopter:
  rotors_count: 6
  across_m: 0.48                     # [A] full cage
  prop_diameter_m: 0.127             # [A] 5 in
  arm_length_m: 0.160                # [D] 0.24 - 0.0635 prop radius - 0.015 cage gap; adjacent props 0.16 m apart
  spin_pattern_label: PPNNPN         # [D] CHANGED from PNPNPN after the Phase 2 rotor-out check. PNPNPN can make
                                     #     zero moments at hover with one rotor out (LP: up to 20 N) but then has
                                     #     roll/pitch authority in only half the directions: falls in 6/6 simulated
                                     #     failures. PPNNPN keeps full control for 4/6 failures (sim: height within
                                     #     0.13 m) and falls for the other 2 (10 N available). No flat 6-rotor pattern
                                     #     does 6/6; 20 deg dihedral rotor tilt gives 6/6 in the LP but only ~3 mN m of
                                     #     worst-axis authority. Meeting "fly level with one rotor failed" for every
                                     #     rotor needs a coaxial Y6 or an octocopter (see PHASE_2.md).
  mass_empty_kg: 1.0                 # CHANGED from [A] 1.1: three loaded hexes + lean rail must fit 5 kg
                                     #     (3 x 1.4 + 0.75 = 4.95 kg). Mass breakdown in PHASE_2.md (~0.85-0.95 kg buildable)
  mass_loaded_kg: 1.4                # CHANGED from [A] 1.5 (empty + 0.4 kg drink)
  thrust_max_total_n: 30.0           # [A]
  battery_wh: 40.0                   # [A]
  battery_usable_frac: 0.85          # [E]
  avionics_power_w: 6.0              # [E] 2 radars, 10 IR rangefinders, 2 radios, computer
  figure_of_merit_nd: 0.55           # [E] small 5 in props
  motor_esc_efficiency_nd: 0.80      # [E]
  cage_loss_frac: 0.05               # [E] thrust lost to cage blockage
  yaw_torque_per_thrust_m: 0.012     # [E]
  drag_area_m2: 0.07                 # [E] frontal CdA of a 0.48 m open cage + body
  plan_drag_ratio_nd: 1.6            # [E] plan-view CdA / frontal (the cage disc faces the flow when tilted)
  drag_area_cases_m2: [0.03, 0.05, 0.07, 0.10]
  prop_zero_thrust_axial_speed_m_s: 42.0   # [E] 5x4.3 at ~22k rpm
  max_tilt_deg: 65.0
  rail_mass_per_dock_lean_kg: 0.15   # [E] lightest credible dock (funnel 0.08, latch 0.05, fittings); CHANGED
                                     #     rail to this value (was 0.25 per dock) so three hexes fit
  sensing_budget_kg: 0.075           # [A]
  mission_energy:                    # [E] phase durations for one sortie
    descent_s: 20
    inbound_s: 90
    deliver_landing_s: 10
    deliver_hover_s: 0
    outbound_s: 90
    climb_m: 40
    wait_s: 60
    attempts_count: 3
    attempt_s: 25
    reposition_s: 15
    docking_airspeed_m_s: 18.5
  # ---- flight model (Phase 2, hexacopter addendum) ----
  inertia_kg_m2: [0.008, 0.008, 0.014]   # [E] six 30 g motor+prop at 0.16 m, 0.15 kg cage ring at 0.24 m
  motor_tau_up_s: 0.030              # [E] 5 in props
  motor_tau_down_s: 0.045
  rot_damping_nm_s2: 4.0e-5          # [E] cage and props
  cage_radius_m: 0.24                # [A] 0.48 m across
  cage_half_height_m: 0.10           # [E] cage modelled as a cylinder 0.48 m x 0.20 m
  cage_impact_rating_m_s: 1.0        # [E] contact faster than this along the normal counts as a collision
  rotor_fail_detect_delay_s: 0.10    # [E] ESC rpm telemetry
  controller:
    att_p_per_s: [7.0, 7.0, 2.5]
    rate_max_deg_s: [250.0, 250.0, 90.0]
    rate_p_per_s: [18.0, 18.0, 6.0]
    rate_i_per_s2: [30.0, 30.0, 6.0]
    rate_d_s: [0.010, 0.010, 0.0]
    rate_d_lpf_hz: 40.0
    thrust_usable_fraction_nd: 0.95
  outer:
    kv_per_s: 2.2
    ki_per_s2: 0.4
    kp_pos_per_s: 1.0
    a_max_m_s2: 6.0                  # [D] ~31 deg tilt: holds position against ~12 m/s of wind (3.0 lost S2/19 downwind)
    yaw_rate_max_deg_s: 60.0
  sensors:
    accel: {rate_hz: 400, delay_s: 0.003, noise_std: 0.05, bias_std: 0.05, bias_rw_std_per_sqrt_s: 0.002}
    gyro: {rate_hz: 400, delay_s: 0.003, noise_std: 0.005, bias_std: 0.003, bias_rw_std_per_sqrt_s: 0.0002}
    ahrs: {rate_hz: 200, delay_s: 0.010, noise_std_deg: 0.3, bias_std_deg: 0.5, bias_rw_deg_per_sqrt_s: 0.02,
           yaw_noise_std_deg: 1.0, yaw_bias_std_deg: 4.0}     # [E] magnetometer near steel and concrete
    baro_diff:                       # hex baro minus the beacon's (beacon baro arrives over the long-range radio)
      rate_hz: 25
      delay_s: 0.04
      noise_std_m: 0.12              # [E] sensor noise plus pressure fluctuation
      offset_std_m: 0.25             # [E] mismatch between the two sensors after matching
      drift_rw_m_per_sqrt_s: 0.01    # [E] weather and temperature drift (~0.2 m in 6 min)
      gust_coeff_m_per_m2_s2: 0.004  # [E] dynamic-pressure error per (local wind speed)^2 near facades
    radar:                           # [A] the user's estimates, UNVALIDATED
      rate_hz: 15
      delay_s: 0.03
      mounts_pitch_deg: [-45.0, 45.0]   # radar 1 forward and 45 deg down, radar 2 forward and 45 deg up
      half_fov_deg: 60.0
      angular_resolution_deg: 15.0
      angle_noise_std_deg: 3.0       # [E] angle accuracy of a single return (resolution is 15 deg)
      range_resolution_m: 0.1
      range_noise_std_m: 0.05
      subrays_per_beam_count: 2      # per axis (2 x 2 rays sample each 15 deg beam)
      range_solid_m: 20.0
      range_glass_m: 8.0
      range_foliage_m: 8.0
      p_detect_foliage_nd: 0.35      # "weakly": chance per beam per scan
      range_person_m: 8.0            # [E] not in the user's list
      p_detect_person_nd: 0.7
      range_fabric_m: 4.0            # [E] awnings, not in the user's list
      p_detect_fabric_nd: 0.5
      wire_range_m: 10.0             # metal wire >= 3 mm, within 20 deg of perpendicular
      wire_full_range_within_deg: 20.0
      wire_zero_range_at_deg: 60.0   # [E] "less at shallow angles": linear taper to zero here
      wire_min_diameter_m: 0.003
      wire_range_scale_nd: 1.0       # ablation knob (0.5 and 2.0)
      velocity_noise_std_m_s: 0.2    # [A] "to 0.2 m/s", taken as 1 sigma per axis (pessimistic reading)
      velocity_bias_std_m_s: 0.03    # [E]
      velocity_structure_range_m: 30.0
    ir:                              # 8 x 8 multizone time-of-flight, [A]
      rate_hz: 15
      delay_s: 0.03
      zones_count: 8
      fov_deg: 45.0
      range_shade_m: 4.0
      range_sun_m: 1.5
      noise_std_frac: 0.02
      noise_std_min_m: 0.01
      ring_count: 8
      min_object_diameter_m: 0.05    # [E] thinner things are not seen ("no thin objects")
    ranging_radio:                   # 3-antenna UWB-like ranging to the beacon, [A]
      rate_hz: 10
      delay_s: 0.02
      max_range_m: 100.0
      range_err_std_min_m: 0.1
      range_err_std_max_m: 0.3
      bearing_err_std_min_deg: 5.0
      bearing_err_std_max_deg: 10.0
      p_reflection_nd: 0.05          # [E] false reading from a reflection, line of sight
      p_reflection_near_facade_nd: 0.15   # [E] within 5 m of a facade
      p_nlos_reflection_nd: 0.3      # [E] blocked: chance of a reflected (wrong) reading instead of none
      reflection_extra_range_m: [1.0, 8.0]
      reflection_bearing_err_deg: 40.0
    long_range_radio:                # coarse distance only, [E]
      rate_hz: 1
      delay_s: 0.2
      range_err_std_m: 5.0
      range_err_frac: 0.1
    contact:                         # contact detection from IMU and motor effort, [E]
      delay_s: 0.05
      force_threshold_n: 1.5
      p_detect_nd: 0.95
      false_rate_per_s: 0.002
      direction_err_deg: 20.0
  sensing_mass_breakdown_kg:         # [E] the 75 g budget (addendum)
    radars_2x: 0.020                 # 60 GHz single-chip radar modules ~8-10 g each
    ir_multizone_10x: 0.015          # VL53L5CX-class boards ~1.5 g each with cabling
    ranging_radio_3_antenna: 0.010
    long_range_radio: 0.006
    baro_imu: 0.002
    computer: 0.018                  # [E] microcontroller-class (no camera, no neural nets)
    harness: 0.004

delivery:                            # navigation and scenario settings (addendum sections 2-3)
  grid_cell_m: 0.2
  margin_solid_m: 1.0
  margin_wire_m: 2.0
  margin_tree_m: 3.0
  speed_open_m_s: 3.0
  speed_near_m_s: 1.0                # within 5 m of structure
  speed_close_m_s: 0.5               # within 2 m and inside the balcony
  near_m: 5.0
  close_m: 2.0
  replan_hz: 2.0
  path_record_spacing_m: 0.5
  cross_height_above_beacon_m: 0.6   # [D] railing crossing height above the beacon
  entry_standoff_m: 1.6              # [D] entry point this far out from the railing
  unseen_cost_nd: 0.6                # extra cost per metre through unseen cells (plans may cross them; flight may not)
  max_contacts_inbound_count: 3
  give_up_reserve_frac: 0.15         # [D] energy kept back beyond the estimated return
  release_pos_err_std_m: 0.5         # [E] mothership's estimate of the release point in the beacon frame
  time_window_s: 420                 # [D] the pickup run passes this long after release
  pickup_radius_m: 3.0               # [D] handover: within this of the pickup point, in open sky; the
                                     #     mothership's own ranging antennas take over from here
  land_settle_s: 3.0
  line_length_m: 1.6                 # drink-lowering option
  line_speed_m_s: 0.3
  line_cd_area_m2: 0.006             # [E] cup drag area on the line
  scan_match_hz: 2.0
  scan_match_search_m: 0.6
  beacon_mount_label: railing        # railing | wall
  delivery_method_label: land        # land | line

# =====================================================================================
# 2026-11-20: Bee35 delivery drones on a passive four-pocket dock on top of the Pioneer 3200.
# Source: "Passive four-drone dock: simulation spec" v0.1 (dock-sim-spec.md), transcribed with
# unit suffixes. Tags: (E) estimate, (P) placeholder, both from the spec; [D] decided here,
# with the reason; [U] from the user. The hexacopter and delivery blocks above are superseded.
# Frame D (spec section 2): origin at the centre of the pocket row on the seat surface,
# +x forward, +y up, +z starboard. Godot: dock +x -> Godot -z, dock +z -> Godot +x.
# =====================================================================================

bee35:                               # SpeedyBee Bee35 class, 3.5 in (89 mm) ducted props [U]
  size_m: [0.210, 0.060, 0.210]      # collision box, underside at y = 0
  mass_kg: 0.545                     # (E) without box
  bracket_mass_kg: 0.010             # (E)
  inertia_kg_m2: [0.0022, 0.0040, 0.0022]   # (E) Ixx, Iyy (yaw, y is up), Izz
  thrust_max_total_n: 35.0           # (P) check against motor data
  motor_tau_s: 0.04                  # (E)
  drag_area_m2: 0.03                 # (E) Cd x A, isotropic
  skid_pad_offset_m: 0.085           # four steel pads at (+-0.085, 0, +-0.085)
  rotor_offset_m: 0.0575             # [D] rotor centres at (+-0.0575, +-0.0575): 89 mm props in ducts inside 0.21 m
  rotor_diameter_m: 0.089
  yaw_torque_per_thrust_m: 0.012     # [E] small-prop drag/thrust ratio
  tag_pos_m: [0.0, 0.060, 0.0]       # UWB tag
  down_sensor_pos_m: [0.085, 0.0, -0.100]   # [D] range+flow sensor. MOVED off the centre: at the centre it looks
                                     #     down the 0.130 m box well and reads the fuselage (0.146 m), so the spec's
                                     #     "range <= 0.02" cutoff could never fire. Chosen so the beam sees flat floor
                                     #     (1) seated: x-offset 0.085 lies between the well edge 0.065 and the seat edge
                                     #     0.107; (2) during the descent at hold z +0.18: beam at z 0.08, inboard of the
                                     #     starboard lip (0.107); (3) clear of the post (beam x is not the post x).
  battery_wh: 24.4                   # [E] 6S 1100 mAh LiPo, typical for this class
  battery_usable_frac: 0.85
  hover_efficiency_nd: 0.29          # [E] momentum-theory ideal power / electrical power, open-rotor basis:
                                     #     FoM 0.45 x motor+ESC 0.65; ducts taken as no net gain (cinewhoop ducts
                                     #     are short). Gives ~180 W hover at 0.555 kg, in line with the 5-7 min
                                     #     hover times reported for 3.5 in cinewhoops on 6S 1100 mAh.
  bracket:                           # catch bracket, port side, drone frame B
    slot_z_m: -0.111
    slot_end_z_m: -0.106
    slot_width_m: 0.012
    slot_mouth_z_m: -0.117
    mouth_half_width_m: 0.100
    mouth_z_m: -0.165
    y_min_m: 0.015
    y_max_m: 0.045
    thickness_m: 0.003
  box:
    size_m: [0.100, 0.125, 0.100]
    rim_m: [0.120, 0.004, 0.120]
    mass_kg: 0.290                   # (E) 8 oz (237 ml) coffee
    rim_drop_m: 0.010                # rim top this far below the drone underside
  controller:                        # [D] tuned in docksim/checks
    kp_pos_per_s2: 9.0
    kv_per_s: 6.0
    ki_pos_per_s3: 4.0
    i_max_m_s2: 6.0                  # [D] must exceed the steady drag accel: 9 m/s on an empty Bee35 is 2.7 m/s^2 before gusts
    a_max_m_s2: 6.0
    max_tilt_deg: 35.0
    att_kp_per_s2: [150.0, 120.0, 150.0]  # about x, y (yaw), z. Yaw is stiff on purpose: the port-side bracket yaws the drone at post contact
    att_kd_per_s: [22.0, 22.0, 22.0]
    accel_process_sigma_m_s2: 0.6      # relative-navigation filter process noise
    dock_accel_lpf_s: 0.3
    thrust_usable_frac: 0.95

dock:
  mass_kg: 0.7                       # (E) dock, posts, fairing, beacons: 0.6-0.8
  pocket_x_m: [0.435, 0.145, -0.145, -0.435]   # P1 (front) .. P4 (rear)
  pocket_pitch_m: 0.290              # (E)
  seat_size_m: 0.214
  seat_corner_radius_m: 0.030
  well_size_m: 0.130
  floor: {x_min_m: -0.630, x_max_m: 0.580, z_half_m: 0.190, thickness_m: 0.006}
  ridge: {x_m: [0.290, 0.0, -0.290], base_m: 0.076, height_m: 0.038, z_half_m: 0.107}
  end_wedge: {x_inner_m: 0.542, x_outer_m: 0.580, height_m: 0.038}
  starboard_lip: {z_inner_m: 0.107, z_outer_m: 0.145, height_m: 0.038}
  post: {z_m: -0.111, height_m: 0.280, radius_real_m: 0.004, radius_sim_m: 0.005, tip_radius_m: 0.010}
  fuselage_top_y_m: -0.146
  pylon: {x_m: [0.560, 0.290, 0.0, -0.290, -0.600], size_m: [0.010, 0.140, 0.060], top_y_m: -0.006}
  fairing: {x_min_m: 0.580, x_max_m: 0.800, z_half_m: 0.190, top_y_m: 0.070}
  magnet: {pads_per_pocket: 4, pad_offset_m: 0.085, force_per_pad_n: 3.0, max_gap_m: 0.006, align_tol_m: 0.010}
  contact:                           # friction coefficients (E); restitution via MuJoCo damping ratio
    skid_seat_mu: 0.40
    skid_ridge_mu: 0.15
    post_bracket_mu: 0.20
    body_body_mu: 0.40
    restitution_skid_nd: 0.1
    restitution_body_nd: 0.2
    contact_timeconst_s: 0.004       # [D] MuJoCo solref time constant (>= 2 physics steps)
  physics_hz: 1000                   # [D] spec: 240 Hz or more. 1 kHz needs no continuous collision detection:
                                     #     at the 0.3 m/s worst contact speed a step moves 0.3 mm, a tenth of
                                     #     the 3 mm fence (MuJoCo has no CCD).
  control_hz: 500                    # [D]

mothership_airframe:                 # Makeflyeasy Pioneer 3200 [U]; shapes in frame D for blocking and strikes
  mass_kg: 25.0                      # (P) kinematic body in the dock sim
  hover_height_m: 70.0
  fuselage_box_m: [[-1.00, -0.556, -0.125], [0.85, -0.146, 0.125]]   # [E] 1.68 m x 0.41 m x 0.25 m under the dock
  wing_box_m: [[-0.06, -0.186, -1.60], [0.25, -0.146, 1.60]]          # [E] 3.2 m span, 0.31 m chord, 0.04 m thick, top flush with the fuselage top
  fin_box_m: [[-1.17, -0.146, -0.015], [-0.93, 0.28, 0.015]]          # [E] fin; A3 sits on a 0.02 m mast above its top (an anchor flush with the top is blocked by the fin itself from anywhere below it)
  rotors:                            # all (P)
    pos_m: [[0.50, -0.10, 0.55], [0.50, -0.10, -0.55], [-0.50, -0.10, 0.55], [-0.50, -0.10, -0.55]]
    radius_m: 0.28
    strike_radius_m: 0.30
    strike_half_height_m: 0.08
    inflow_speed_m_s: 4.0
    inflow_height_m: 0.5
  anchors_m:                         # UWB anchors, frame D (spec section 5)
    A1: [0.10, -0.10, 1.55]          # (P) starboard wingtip
    A2: [0.10, -0.10, -1.55]         # (P) port wingtip
    A3: [-1.05, 0.30, 0.0]           # (P) fin top
    A4: [-0.62, 0.02, 0.0]           # (E) dock rear
  anchor_set_label: triangle         # [U] "mothership has 3 beacons in a triangle": A1, A2, A3 (the widest
                                     #     triangle around the dock). The spec's four-anchor set is a variant.
  anchor_sets:
    triangle: [A1, A2, A3]
    spec4: [A1, A2, A3, A4]
  hover_motion:                      # filtered random process per axis (spec 8.2)
    calm: {h_rms_m: 0.2, v_rms_m: 0.1, yaw_rms_deg: 2, tilt_rms_deg: 1}
    moderate: {h_rms_m: 0.5, v_rms_m: 0.2, yaw_rms_deg: 5, tilt_rms_deg: 2}
    gusty: {h_rms_m: 1.0, v_rms_m: 0.4, yaw_rms_deg: 10, tilt_rms_deg: 4}
    tau_pos_s: 3.0                   # (E)
    tau_yaw_s: 4.0
    tau_tilt_s: 1.0
    filter_order: 3                  # [D] three cascaded first-order lags, so position, velocity and acceleration are all continuous
  wind_from_nose_max_deg: 45.0       # [D] a hovering quadplane points into wind; wind arrives within +-45 deg

dock_sensors:                        # spec section 6, drone side
  uwb: {rate_hz: 20, sigma_m: 0.05, bias_max_m: 0.05, dropout_p: 0.02, blocked_bias_m: [0.10, 0.30]}
  pocket_beacons:                    # [D] variant only: one short-range UWB beacon per pocket, on a 0.05 m
    enabled: false                   #     stand on the port rail beside the post, ranged by the same tag
    y_m: 0.05
    z_m: -0.19
    sigma_m: 0.03                    # (E) short, clean, line-of-sight links
    bias_max_m: 0.02                 # (E) antenna delay calibrated on the dock
    max_range_m: 2.0                 # heard only near the dock
                                     # rate is per drone; divided by drones in flight
  range: {min_m: 0.02, max_m: 8.0, acc_near_m: 0.04, acc_far_frac: 0.02, rate_hz: 100, beam_deg: 6,
          sigma_per_acc_nd: 0.5}     # [D] the quoted accuracy is taken as 2 sigma
  flow: {min_height_m: 0.08, sigma_m_s: 0.05, rate_hz: 100}
  baro: {sigma_m: 0.3, drift_rw_m_per_sqrt_s: 0.02, rate_hz: 25}
  compass: {sigma_deg: 3.0, bias_frac_nd: 0.7}   # [D] 70 % of the variance is a per-run bias (magnetic
                                                 #     disturbance near the carbon airframe), 30 % white
  imu: {accel_sigma_m_s2: 0.05, gyro_sigma_rad_s: 0.005, attitude_sigma_deg: 0.3}   # [E]
  broadcast: {rate_hz: 10, delay_s: [0.05, 0.10], pos_sigma_m: 0.5, vel_sigma_m_s: 0.1, heading_sigma_deg: 2,
              error_tau_s: 5.0}      # [D] errors are Gauss-Markov with 5 s correlation (GNSS-like)

channel_dock:                        # [D] variant (2026-11-22, user's idea): one walled lane along the centreline,
  enabled: false                     #     open at the rear through a funnel. Drones fly in nose first at entry_y_m
                                     #     and stop nose to tail against the drone ahead (or the front stop), then
                                     #     settle onto the magnets. No posts, ridges, lip or catch brackets.
                                     #     Launch is straight up, last in first out.
  front_stop_x_m: 0.555              # rear face of the front stop
  nose_bar_radius_m: 0.005           # a round bar across each drone's nose at nose_bar_y_m: contact with the drone
  nose_bar_y_m: 0.015                #     ahead stays low on the body, so pitching to push does not hold the skids
                                     #     back (with contact at the body's top corner, levelling on the floor
                                     #     walked the drone back 5-17 mm). Slot pitch = 0.21 + 2 r = 0.22 m
  inner_half_width_m: 0.108          # guide rail: 3 mm clearance each side of the 0.21 m drone
  rail_height_m: 0.03                # the tight rail only this high (the drone's body sides reach 0.06 m)
  upper_extra_clearance_m: 0.010     # above the rail the walls stand 10 mm further out: with 3 mm all the way up,
                                     #     a drone banked ~8 deg jams across the lane like a drawer
  wall_height_m: 0.22                # guides a drone flying in at entry_y_m (body 0.10-0.16 m) with +-0.05 m of
                                     #     height wander (the deck heaves 0.2 m rms at moderate hover)
  wall_thickness_m: 0.006
  straight_extra_m: 0.03             # straight wall behind the rear slot before the funnel starts
  funnel_length_m: 0.40
  mouth_half_width_m: 0.25           # 0.50 m mouth against the pocket bracket's 0.20 m
  wall_mu: 0.15
  entry_y_m: 0.10                    # flight height in the lane. Lower fails: the down range (sigma 0.02 m,
                                     #     min 0.02 m) cannot hold 0.045 m and the drone sinks onto its skids;
                                     #     optical flow needs 0.08 m
  entry_speed_m_s: 0.20
  final_speed_m_s: 0.10               # in the last 0.2 m before the expected slot
  hold_inside_mouth_m: 0.06          # descend this far inside the mouth
  stop_push_n: 0.5                   # forward push against the drone ahead while settling (x has no spring then)
  descent_push_n: 0.5                # push while descending (0.2 N tested: drift case 17/27 vs 25-27/27; body-on-body
                                     #     friction from a hard push held the drone up in a head wind
  final_push_n: 0.3                  # forward push held by tilting the thrust while the motors spool down
  catch_tol_m: 0.15                  # a stop counts as the slot if the estimate is within this of it
  bumper_top_y_m: 0.24               # a rear plate on each drone reaches this high, so an arriving drone flying at
                                     #     entry_y_m meets the one ahead instead of riding over it
  stop_speed_m_s: 0.02               # stopped: forward flow speed below this for stop_window_s
  stop_window_s: 0.3
  stop_contact_speed_m_s: 0.3        # pass criterion: speed when touching the drone ahead or the stop
  twin_fin_z_m: 0.40                 # the single fin blocks the entry: twin fins at +-0.40 m, A3 on the starboard one
  mouth_beacons: false               # variant: two short-range UWB beacons at the funnel mouth corners (needs
                                     #     dock_sensors.pocket_beacons enabled; same model as the slot beacons)
  launch_tilt_back_deg: 4.0          # launch: thrust tilted back during the ramp, so the drone eases off the one
                                     #     ahead as the magnets let go (level: 23-54 N knocks in 8 of 24 launches)
  down_sensor_z_m: -0.0865            # drone range/flow sensor moved inboard (was -0.100): 2 mm from the rail its
                                     #     beam caught the rail top, read short, and the drone climbed over the drone ahead
  approach_mode_label: fly           # fly: hold entry_y_m all the way in; slide: settle onto the apron and skid in
  slide_weight_frac: 0.15            # slide: fraction of the weight left on the skids
  slide_stop_speed_m_s: 0.04         # slide: stopped when the UWB + IMU speed stays below this ...
  slide_stop_window_s: 0.6           # ... this long (no flow on the skids)

dock_ops:
  launch_order: [P4, P1, P3, P2]
  recovery_order: [P2, P3, P1, P4]
  recovery: {hold_y_m: 2.0, hold_z_m: 0.18, descent_speed_m_s: 0.3, approach_y_m: 0.17, approach_speed_m_s: 0.10,
             stop_speed_m_s: 0.02, push_force_n: 0.5, final_descent_speed_m_s: 0.15, cutoff_range_m: 0.02,
             max_travel_m: 0.30, max_aborts: 3, abort_err_m: 0.20, abort_below_y_m: 0.5, time_limit_s: 40.0,
             start_offset_m: [0.0, 3.0, 3.0],   # [D] drone cleared to land from 3 m up and 3 m starboard of the pocket
             cutoff_samples: 5,      # [D] range must read at or below the cutoff on this many consecutive samples
             catch_travel_m: [0.08, 0.30],   # [D] a stop counts as the post only inside this travel window ...
             catch_height_tol_m: 0.05}       # [D] ... and with the range within this of the approach height
  launch: {thrust_ramp_n_s: 20.0, climb_speed_m_s: 1.0, clear_y_m: 1.0, depart_y_m: 2.0, gap_s: 5.0,
           depart_z_m: 3.0, clear_time_s: 3.0,
           sidestep_y_m: 0.05, sidestep_z_m: 0.07}   # [D] variant: rise past the lip, step off the post, then climb
  pass:
    final_xz_err_m: 0.005
    final_heading_err_deg: 5.0
    post_contact_speed_m_s: 0.3
    touchdown_speed_m_s: 0.5
    parked_touch_above_y_m: 0.06
  hold_test: {vertical_g: [-0.5, 1.5], sideways_g: 0.3, rear_force_n: 3.0, max_shift_m: 0.003}   # [D] "stays seated": no lift-off and the shift stays inside the 2 mm pocket clearance (+1 mm)

dock_matrix:                         # spec section 13
  hover_level: [calm, moderate, gusty]
  wind_mean_m_s: [0, 3, 6, 9]
  wind_turbulence_frac: 0.15
  wind_time_scale_s: [1.0, 5.0]
  ranging_noise_scale: [1.0, 2.0]
  anchor_loss: [none, one]
  parked_neighbours: [0, 1, 2]
  launch_box: [false, true]
  trials_per_cell: 200
  target_pass_frac: 0.95             # moderate hover, 6 m/s

balcony_mission:                     # Phase 4: Bee35 from the dock to a balcony and back (user, 2026-11-20)
  # The balcony is marked by a "drop the coffee here" sign on its back wall carrying three UWB
  # beacons in a triangle [U]. The path from the sky to the balcony side of the building is clear [U].
  sign:
    triangle_side_m: 0.6             # [D] baseline: an A1/A2-poster-sized sign. Variants 0.3 and 1.0
    centre_height_above_floor_m: 1.5 # [D] install data: sign centre height above the balcony floor
    drop_out_from_wall_m: 0.6        # [D] the drop mark: on the floor, under the sign, this far out
    barometer: false                 # [U] the user's sign has beacons only; variant: a barometer in the sign
    baro_sigma_m: 0.3                # sign barometer, when present (same part as the drone's)
    survey_sigma_m: [1.0, 1.0, 0.5]  # [E] mothership's prior of the sign position in the world (x, y, z)
  hover_standoff_m: [20.0, 60.0]     # [D] mothership hover position from the facade, horizontal
  hover_lateral_m: [-20.0, 20.0]
  hover_height_agl_m: 70.0           # spec 8.1
  hover_clear_above_roof_m: 10.0
  cruise_speed_m_s: 5.0              # [D] transit
  near_speed_m_s: 1.0                # within 6 m of the wall
  inside_speed_m_s: 0.5              # inside the balcony
  gate_out_m: 4.0                    # [D] gate: this far out from the wall, at entry height
  entry_height_above_floor_m: 1.85   # [D] underside height crossing the railing: box bottom 0.57 m over a
                                     #     1.15 m railing, drone top 0.69 m under a 2.6 m slab
  setdown_range_m: 0.15              # box bottom touches the floor when the underside is ~0.135 m up
  release_slide_m: 0.15              # slide off the fork rails (rim 0.12 m) along the drone's x axis
  drop_tolerance_m: 0.30             # [D] box must land within this of the mark
  balcony_time_limit_s: 120.0        # give up the drop after this long at the balcony
  energy_reserve_frac: 0.20          # give up when the estimated return would eat into this reserve
  drone_capsule_radius_m: 0.15       # collision shape: Bee35 footprint diagonal
  handover_tol_m: 0.3                # recovery start point reached (dock frame) within this
  transit_max_tilt_deg: 55.0         # [D] away from the dock. A Bee35 has thrust/weight ~6; at the dock's 35 deg
                                     #     limit its top airspeed is ~14 m/s, below the gusts above a roof in 10 m/s wind
  transit_max_accel_m_s2: 10.0
